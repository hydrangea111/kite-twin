; ESP32-CAM + EBIMU 배선 확인용. 카메라는 쓰지 않는다.
;
; 업로드 방법이 다른 보드와 다르다. ESP32-CAM 에는 USB 단자가 없으므로
; USB-TTL 변환기를 따로 붙이고, 업로드 직전에 GPIO0 을 GND 에 물린 뒤
; RST 를 한 번 눌러야 한다. 끝나면 GPIO0 을 떼고 다시 RST.

[env:imu_cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags = -I$PROJECT_DIR/../../common

; 앱 슬롯을 둘로 나눈다. 기본값(huge_app)은 3MB 단일 슬롯이라 OTA 가 아예
; 불가능하다. min_spiffs 는 app0/app1 을 각각 1.9MB 로 주므로, 1.2MB 인 이
; 펌웨어가 들어가고 블루투스로 새 펌웨어를 받아 넣을 자리가 남는다.
board_build.partitions = min_spiffs.csv
